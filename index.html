  <body class="bg-brand-cream text-brand-charcoal font-sans antialiased selection:bg-brand-accent selection:text-brand-dark min-h-screen">
    <div hidden aria-hidden="true">
      <form name="solar-professional-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="solar-professional-interest" />
        <input name="bot-field" />
        <input name="interest_type" /><input name="full_name" /><input name="email" /><input name="phone" />
        <input name="state" /><input name="city" /><input name="service_required" /><textarea name="service_description"></textarea>
        <input name="business_name" /><input name="services_offered" /><input name="experience_years" />
        <textarea name="qualifications"></textarea><input name="portfolio_link" /><textarea name="professional_experience"></textarea>
        <input name="privacy_consent" />
      </form>
      <form name="energy-project-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="energy-project-interest" />
        <input name="bot-field" />
        <input name="interest_type" /><input name="full_name" /><input name="email" /><input name="phone" />
        <input name="country" /><input name="city" /><input name="project_interest" /><input name="state" />
        <input name="business_name" /><input name="energy_user_type" /><textarea name="energy_challenge"></textarea>
        <textarea name="additional_message"></textarea>
        <input name="energy_requirement" /><input name="organisation_name" /><input name="partnership_location" />
        <input name="collaboration_area" /><textarea name="partnership_description"></textarea><input name="privacy_consent" />
      </form>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
